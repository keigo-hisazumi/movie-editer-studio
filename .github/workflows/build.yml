# アプリの書き出し：Mac の .app と Windows の .exe を Tauri で作り、Actions の成果物（Artifacts）に置く
# main への push（マージ）のときは、GitHub の Releases の「最新版」（タグ latest）にも置き直す。
# ダウンロードの URL はいつも同じ（README の「入れ方」）：
#   https://github.com/<owner>/<repo>/releases/download/latest/movie-editer-studio-mac.zip
#   https://github.com/<owner>/<repo>/releases/download/latest/movie-editer-studio-windows.zip
# 「最新版」はプレリリースにする（Release Drafter が前の版とみなさず、v0.x のリリースノートの下書きが崩れないように）
# （Apple・Microsoft の署名はしていない。Mac はその場の署名（ad-hoc）だけ。初回は Mac なら右クリック ▸ 開く、
#   Windows なら「詳細情報 ▸ 実行」で開く）

name: Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 書き出し（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      # Releases の「最新版」に置くため（main への push のときだけ使う）
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: 依存関係のインストール
        run: npm ci
      - name: Tauri で書き出す（Mac）
        if: runner.os == 'macOS'
        run: npx tauri build --bundles app
      - name: Tauri で書き出す（Windows）
        if: runner.os == 'Windows'
        # WebView2 は Windows 10・11 に入っているので、インストーラーは作らず .exe 1 つにする
        run: npx tauri build --no-bundle
      - name: まとめる場所に置く
        shell: bash
        run: |
          mkdir -p out
          if [ "$RUNNER_OS" = macOS ]; then
            cp -R "src-tauri/target/release/bundle/macos/movie-editer studio.app" out/
          else
            cp src-tauri/target/release/movie-editer-studio.exe "out/movie-editer studio.exe"
          fi
      - name: 書き出したアプリの確かめ（Mac）
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: |
          exe=$(find "out/movie-editer studio.app/Contents/MacOS" -type f -perm -u+x | head -1)
          code=0
          "$exe" --self-check tests/data/sample.mp4 || code=$?
          cat self-check.log
          exit "$code"
      - name: 書き出したアプリの確かめ（Windows）
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: bash
        run: |
          code=0
          "out/movie-editer studio.exe" --self-check tests/data/sample.mp4 || code=$?
          cat self-check.log
          exit "$code"
      - name: まとめる（Mac）
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "out/movie-editer studio.app" movie-editer-studio-mac.zip
      - name: まとめる（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "out/movie-editer studio.exe" -DestinationPath movie-editer-studio-windows.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # 自分で作った zip をそのまま置く（もう一度 zip に包まない。ダウンロードして1回展開すればアプリが出る）
          # archive: false のときの成果物の名前はファイル名（movie-editer-studio-mac.zip など）
          path: movie-editer-studio-${{ runner.os == 'macOS' && 'mac' || 'windows' }}.zip
          archive: false
          retention-days: 30
      - name: Releases の「最新版」に置く（main への push のときだけ）
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ZIP: movie-editer-studio-${{ runner.os == 'macOS' && 'mac' || 'windows' }}.zip
        run: |
          # 「最新版」が無ければ作る（Mac と Windows が同時に作ろうとして片方が失敗しても、もう有ればよい）
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --prerelease --title "最新版" --notes "準備中" --target "$GITHUB_SHA" \
              || gh release view latest >/dev/null
          fi
          # タグ latest をこのコミットに付け替える（どちらの OS が先に来ても同じコミットになる）
          gh api -X PATCH "repos/$GH_REPO/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          # 同じ名前のファイルを置き直す（URL は変わらない）
          gh release upload latest "$ZIP" --clobber
          short="${GITHUB_SHA:0:7}"
          gh release edit latest --prerelease --title "最新版" --notes "$(cat <<NOTES
          main の最新のコミット（[${short}](https://github.com/${GH_REPO}/commit/${GITHUB_SHA})）から自動で作ったアプリです。main にマージするたびに置き直します。

          - Mac：movie-editer-studio-mac.zip
          - Windows：movie-editer-studio-windows.zip

          ダウンロードして1回展開するとアプリが出てきます（Mac の Safari では自動で展開されます）。署名していないので、初回は Mac なら右クリック ▸ 開く、Windows なら「詳細情報 ▸ 実行」で開きます。
          NOTES
          )"
