# CI：画面（TypeScript）の型・テスト・ビルドと、アプリ側（Rust）の Lint・テスト
# Mac・Windows のアプリの書き出しは build.yml

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: 画面の型・テスト・ビルド
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: 依存関係のインストール
        run: npm ci
      - name: 型チェック
        run: npm run type-check
      - name: テスト
        run: npm test
      - name: ビルド
        run: npm run build

  rust:
    name: アプリ側（Rust）の Lint・テスト
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tauri が使うライブラリ（Linux の WebView）
        run: sudo apt-get update -q && sudo apt-get install -y -q libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev
      - name: Lint（clippy）
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: テスト
        working-directory: src-tauri
        run: cargo test --locked
