# CI ワークフロー：Lint（ruff）とテスト（pytest。Qt は画面を出さずに動かす）

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint・テスト
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Qt が使うライブラリ
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libpulse0
      - name: 依存関係のインストール
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: テスト
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
          STUDIO_NO_AUDIO: '1'
